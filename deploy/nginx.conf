server {
    listen 80;
    listen [::]:80;
    server_name docs.siping.me;

    root /var/www/agentic-design-patterns/releases/current;
    index index.html;
    charset utf-8;
    autoindex off;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(?:css|js|mjs|svg|png|jpe?g|gif|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
