name: Build and deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: 101.133.167.31
      DEPLOY_USER: agentic-deploy
      DEPLOY_ROOT: /var/www/agentic-design-patterns
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build static site
        run: |
          npm ci
          npm run build

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_SSH_KEY" || { echo 'Missing DEPLOY_SSH_KEY'; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cp deploy/known_hosts ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release and switch current
        run: |
          release="$DEPLOY_ROOT/releases/${GITHUB_SHA}"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$release'"
          rsync -az --delete --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r build/ "$DEPLOY_USER@$DEPLOY_HOST:$release/"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "ln -sfn '$release' '$DEPLOY_ROOT/releases/current.next' && mv -Tf '$DEPLOY_ROOT/releases/current.next' '$DEPLOY_ROOT/releases/current' && find '$DEPLOY_ROOT/releases' -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\\n' | sort -nr | tail -n +6 | cut -d' ' -f2- | xargs -r rm -rf"
